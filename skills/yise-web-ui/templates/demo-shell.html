<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{NAME}} figma preview</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #080b10; color: #e5e7eb; }
</style>
</head>
<body>
<!-- 产品视图纯净入口:index.html?product=1 只渲染产品帧,不建控制栏/切换器/拉伸手柄、不暴露 __qa。
     验收/交付截图一律走这条路径(文件名 *-product.png);QA 壳视图(默认入口)截图只算 candidate 证据。 -->
<script id="qa-truth" type="application/json"></script>
<script id="qa-devices" type="application/json">{{QA_DEVICES}}</script>
<script>
window.__qaDemo = {
  name: '{{NAME}}',
  pr: {{PR}},
  summary: {
    what: 'Preview the first browser-visible page from source Figma truth.',
    how: 'Generated by the public yise-web-ui Figma preview shell; renderer code is inlined by figma-inline.',
    accept: 'Chrome must show at least one real Figma-derived source node, not a placeholder shell.',
  },
  matrix: {
    plat:   { label: 'Platform', options: [{ v: 'desktop', label: 'Desktop' }, { v: 'mobile', label: 'Mobile' }] },
    region: { label: 'Region', options: [{ v: 'cn', label: 'CN' }, { v: 'global', label: 'Global' }] },
    os:     { label: 'OS', options: [{ v: 'any', label: 'Any' }] },
    mode:   { label: 'Mode', options: [{ v: 'default', label: 'Default' }] },
    lang:   { label: 'Language', options: [{ v: 'zh-CN', label: 'zh-CN' }] },
  },
  defaultPrefs: { plat: 'desktop', region: 'cn', os: 'any', mode: 'default', lang: 'zh-CN' },
  initialState: 'entry',
  states: { entry: {} },
  tabStates: [],
  adaptive: null,
  scale: () => (window.__figmaRender && typeof window.__figmaRender.scale === 'function'
    ? window.__figmaRender.scale()
    : 1),
  renderApp(ctx) {
    if (!window.__figmaRender || typeof window.__figmaRender.renderApp !== 'function') {
      throw new Error('figma preview shell: __figmaRender.renderApp is missing; run figma-inline');
    }
    return window.__figmaRender.renderApp(ctx);
  },
};
</script>
<script>
/* FIGMA_RENDER_BEGIN */
{{FIGMA_RENDER}}
/* FIGMA_RENDER_END */
</script>
<script>
/* FIGMA_CHROME_BEGIN */
{{FIGMA_CHROME}}
/* FIGMA_CHROME_END */
</script>
</body>
</html>
