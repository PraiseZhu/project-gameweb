name: new-draft-gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prechain-tests:
    name: prechain tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run prechain tests
        working-directory: standards/prechain-nightly
        run: npm test

  figma-naming-tests:
    name: figma-naming tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: standards/figma-naming/tool/package-lock.json
      - name: Install figma-naming dependencies
        working-directory: standards/figma-naming/tool
        run: npm ci
      - name: Run figma-naming tests
        working-directory: standards/figma-naming/tool
        run: npm test

  yise-web-ui-tests:
    name: yise-web-ui public tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/yise-web-ui/package-lock.json
      - name: Install yise-web-ui dependencies
        working-directory: skills/yise-web-ui
        run: npm ci
      - name: Run public tests
        working-directory: skills/yise-web-ui
        run: npm run test:public

  new-draft-gate:
    name: newDraftGate four pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Evaluate named and unnamed PC/mobile fixtures
        working-directory: standards/prechain-nightly
        run: npm run eval:new-draft-gate
